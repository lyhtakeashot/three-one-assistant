<style>
*,::before,::after{box-sizing:border-box;margin:0;padding:0}
::root{--p50:#EFF6FF;--p100:#DBEAFE;--p500:#3B82F6;--p600:#2563EB;--p700:#1D4ED8;--p800:#1E40AF;--s8:#1E293B;--s5:#64748B;--s4:#94A3B8;--s3:#CBD5E1;--s2:#E5E7EB;--s1:#F1F5F9;--bg:#FFFFFF;--w:#FFF;--g:#16A34A;--y:#F59E0B;--r:#EF4444;--nav-w:248px;--nav-w-mini:68px;--topbar-h:60px;--line:#E5E7EB;--fill:#F1F5F9;--ring:rgba(59,130,246,.28);--grad:linear-gradient(135deg,#3B82F6,#6366F1)}
/* 深色主题：仅重指向语义 token + 少量硬编码类覆盖，不改动类名 */
[data-theme="dark"]{color-scheme:dark;--p50:#17253F;--p100:#1E3A5F;--p600:#3B82F6;--p700:#60A5FA;--p800:#93C5FD;--s8:#E6EDF7;--s5:#94A3B8;--s4:#7C8CA3;--s3:#5A6B85;--s2:#25324A;--s1:#17223A;--bg:#0B1220;--w:#121C2E;--g:#22C55E;--y:#FBBF24;--r:#F26D6D;--line:#22304A;--fill:#182238}
/* 浅色页面底色：字面量纯白（不依赖 var，渲染器必然绘制），与顶栏同一实色，不透出 IDE 底色 */
html,body{background:#FFFFFF}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:#FFFFFF;color:var(--s8);-webkit-font-smoothing:antialiased;line-height:1.6}
#root{min-height:100vh;background:#FFFFFF}
/* 深色主题：页面底色沿用 #0B1220（字面量覆盖，确保同样必然绘制，不被上面的浅色规则压住） */
[data-theme="dark"] html,[data-theme="dark"] body,[data-theme="dark"] #root,[data-theme="dark"] .console{background:#0B1220}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}

.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.items-start{align-items:flex-start}.justify-between{justify-content:space-between}.justify-center{justify-content:center}.flex-wrap{flex-wrap:wrap}
.gap1{gap:4px}.gap2{gap:8px}.gap3{gap:12px}.gap4{gap:16px}.gap6{gap:24px}
.grid{display:grid}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:640px){.sm\\:g2{grid-template-columns:repeat(2,1fr)}.sm\\:g3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.md\\:g3{grid-template-columns:repeat(3,1fr)}.md\\:flex{display:flex}.md\\:hide{display:none}}
@media(max-width:767px){.sm-hide{display:none}}

.text-center{text-align:center}.text-left{text-align:left}
.text-xs{font-size:12px}.text-sm{font-size:14px}.text-base{font-size:16px}.text-lg{font-size:18px}.text-xl{font-size:20px}.text-2xl{font-size:24px}.text-3xl{font-size:28px}.text-4xl{font-size:36px}
.font-bold{font-weight:700}.font-semibold{font-weight:600}.font-medium{font-weight:500}
.text-s8{color:var(--s8)}.text-s6{color:#475569}.text-s5{color:var(--s5)}.text-s4{color:var(--s4)}.text-s3{color:var(--s3)}
.text-p{color:var(--p600)}.text-w{color:var(--w)}.text-g{color:var(--g)}.text-y{color:var(--y)}.text-r{color:var(--r)}
.bg-w{background:var(--w)}.bg-s1{background:var(--s1)}.bg-p50{background:var(--p50)}.bg-p500{background:var(--p500)}.bg-p600{background:var(--p600)}.bg-g50{background:#F0FDF4}.bg-y50{background:#FEF3C7}.bg-r50{background:#FEE2E2}
.rounded-lg{border-radius:12px}.rounded-xl{border-radius:16px}.rounded-2xl{border-radius:20px}
.p1{padding:4px}.p2{padding:8px}.p3{padding:12px}.p4{padding:16px}.p5{padding:20px}.p6{padding:24px}
.px2{padding-left:8px;padding-right:8px}.px3{padding-left:12px;padding-right:12px}.px4{padding-left:16px;padding-right:16px}.px6{padding-left:24px;padding-right:24px}
.py05{padding-top:2px;padding-bottom:2px}.py1{padding-top:4px;padding-bottom:4px}.py15{padding-top:6px;padding-bottom:6px}.py2{padding-top:8px;padding-bottom:8px}.py3{padding-top:12px;padding-bottom:12px}.py6{padding-top:24px;padding-bottom:24px}.py16{padding-top:64px;padding-bottom:64px}
.mb1{margin-bottom:4px}.mb2{margin-bottom:8px}.mb3{margin-bottom:12px}.mb4{margin-bottom:16px}.mb6{margin-bottom:24px}.mb8{margin-bottom:32px}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt4{margin-top:16px}.mt-auto{margin-top:auto}
.ml2{margin-left:8px}.mx-auto{margin-left:auto;margin-right:auto}
.max-w-sm{max-width:400px}.max-w-md{max-width:560px}.max-w-lg{max-width:720px}.max-w-xl{max-width:900px}.max-w-2xl{max-width:1100px}
.w-full{width:100%}.h-full{height:100%}.w-8{width:32px}.h-8{height:32px}.w-12{width:48px}.h-12{height:48px}.w-16{width:64px}.h-16{height:64px}
.flex-1{flex:1}.flex-shrink-0{flex-shrink:0}.min-w-0{min-width:0}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relative{position:relative}.absolute{position:absolute}.fixed{position:fixed}.inset0{inset:0}
.top0{top:0}.left0{left:0}.right0{right:0}.bottom0{bottom:0}
.z50{z-index:50}.z40{z-index:40}
.overflow-hidden{overflow:hidden}.overflow-x-auto{overflow-x:auto}.overflow-y-auto{overflow-y:auto}
.max-h-60{max-height:240px}.max-h-70{max-height:280px}
.shadow-card{box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04)}
.glass{background:rgba(255,255,255,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.glass-border{border-bottom:1px solid var(--s2)}
.hero-bg{background:linear-gradient(135deg,#EFF6FF,#DBEAFE 30%,#BFDBFE 60%,#EFF6FF)}
.gradient-primary{background:linear-gradient(135deg,var(--p600),var(--p700))}
.btn-primary{background:var(--p500);color:var(--w)}.btn-primary:hover{background:var(--p600)}
.card{background:var(--w);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);transition:all .25s}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 4px 16px rgba(0,0,0,.08)}
.tag{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.tag-blue{background:var(--p50);color:var(--p700);border:1px solid var(--p100)}
.tag-green{background:#F0FDF4;color:var(--g);border:1px solid #BBF7D0}
.tag-gray{background:var(--s1);color:var(--s5);border:1px solid var(--s2)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px}
.badge-blue{background:var(--p50);color:var(--p600)}.badge-gray{background:var(--s1);color:var(--s5)}.badge-green{background:#F0FDF4;color:var(--g)}.badge-red{background:#FEE2E2;color:#DC2626}
.badge-yellow{background:#FEF3C7;color:#D97706}
.compare-adv{background:#FEF3C7;color:#D97706;font-weight:700}
.compare-dis{background:#FEE2E2;color:#DC2626;font-weight:700}
hr{border:none;border-top:1px solid var(--s1)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.animate-fade-in{animation:fadeIn .3s}
.animate-slide-up{animation:slideUp .3s}
.tab-btn{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;transition:all .2s;text-align:center}
.tab-active{background:var(--w);color:var(--p600);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.input{border:1px solid var(--s2);border-radius:12px;padding:10px 14px;font-size:14px;width:100%;outline:none;background:var(--w)}
.input:focus{border-color:var(--p500);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.text-break{word-break:break-all}.cursor-pointer{cursor:pointer}.resize-none{resize:none}
.border-t{border-top:1px solid var(--s2)}.border-b{border-bottom:1px solid var(--s2)}
.rounded-full{border-radius:9999px}
.pb-safe{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.h14{height:56px}.pt14{padding-top:56px}.pb16{padding-bottom:64px}
.leading-relaxed{line-height:1.65}
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal-card{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:420px;max-height:84vh;overflow-y:auto;animation:slideUp .3s}
.modal-check{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.modal-check input{width:16px;height:16px;accent-color:var(--p500);cursor:pointer}
.pill-btn{display:inline-block;padding:8px 18px;border-radius:9999px;border:1px solid var(--p100);background:var(--w);color:var(--p600);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.pill-btn:hover{background:var(--p50)}
.disabled\:opacity-50{opacity:.5}
.err-text{color:#EF4444;font-size:12px}

/* ==================== 控制台设计系统（扩展层，不改名既有类） ==================== */
/* 补齐原样式缺失的工具类（原 script 已引用但未定义，属既有 bug） */
.hide{display:none}
.w-4{width:16px}.h-4{height:16px}
.py12{padding-top:48px;padding-bottom:48px}
.whitespace-nowrap{white-space:nowrap}
.border{border:1px solid var(--s2)}
.border-s1{border-color:var(--s1)}
.border-s2{border-color:var(--s2)}
/* 以下类此前被 script 引用但未定义（既有缺陷），一并补齐 */
.mt3{margin-top:12px}
.ml1{margin-left:4px}
.pt3{padding-top:12px}
.py4{padding-top:16px;padding-bottom:16px}
.w-10{width:40px}.h-10{height:40px}
.bg-g{background:var(--g)}.bg-y{background:var(--y)}.bg-r{background:var(--r)}
.font-normal{font-weight:400}
.underline{text-decoration:underline}
.inline-block{display:inline-block}
.rounded{border-radius:6px}
.block{display:block}
.text-\[10px\]{font-size:10px}
.text-s6{color:#475569}
.hover\:bg-s1:hover{background:var(--s1)}
.transition-colors{transition:background-color .18s,color .18s}
.disabled\:opacity-40:disabled{opacity:.4}
.max-w-3xl{max-width:1280px}
.icon{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle}
.link{color:var(--p600);text-decoration:underline;word-break:break-all}
.hamburger{display:none}
.md-only{display:inline-flex}
@media(max-width:767px){.hamburger{display:inline-flex}.md-only{display:none!important}}
.only-desktop{display:none}
.only-mobile{display:block}
@media(min-width:768px){.only-desktop{display:block}.only-mobile{display:none}}
.input-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--s4);pointer-events:none}
.pl-9{padding-left:38px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:16px}
.toolbar .input{width:auto}
.min-w-180{min-width:180px}.min-w-240{min-width:240px}
.stat-inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv:last-child{border-bottom:none}
.kv-k{color:var(--s4);flex-shrink:0}
.kv-v{font-weight:600;text-align:right;min-width:0}
.bar-track{height:6px;border-radius:999px;background:var(--fill);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--grad)}

/* ---------- 骨架：侧边栏是文档流内的兄弟容器，主区由 flex 自动让位/回填，任何宽度下都不会互相压住 ---------- */
.console{display:flex;min-height:100vh;background:#FFFFFF;color:var(--s8);--nav-cur:var(--nav-w)}
.console[data-nav="open"]{--nav-cur:var(--nav-w)}
.console[data-nav="closed"]{--nav-cur:var(--nav-w-mini)}
.console-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.content{width:100%;max-width:1280px;margin:0 auto;padding:24px 26px 48px}

/* ---------- 侧边栏：文档流内兄弟容器（sticky），宽度由 --nav-cur 统一驱动 ---------- */
.sidebar{position:sticky;top:0;align-self:flex-start;flex:0 0 auto;width:var(--nav-cur);height:100vh;z-index:70;display:flex;flex-direction:column;background:var(--fill);border-right:1px solid var(--line);overflow:hidden;transition:width .28s cubic-bezier(.34,1.22,.5,1),background-color .2s ease,transform .26s cubic-bezier(.34,1.22,.5,1)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 16px;flex-shrink:0}
.brand-text{min-width:0;overflow:hidden;transition:opacity .2s ease,width .28s cubic-bezier(.34,1.22,.5,1)}
.brand-title{font-weight:700;font-size:15px;white-space:nowrap;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--s4);white-space:nowrap;margin-top:3px}
.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 12px 16px}
.nav-group{margin-bottom:20px;transition:margin-bottom .28s cubic-bezier(.34,1.22,.5,1)}
.nav-group-title{font-size:11px;font-weight:600;color:var(--s4);letter-spacing:.16em;padding:0 10px 10px;white-space:nowrap;overflow:hidden;transition:opacity .2s ease,width .28s cubic-bezier(.34,1.22,.5,1),padding .28s cubic-bezier(.34,1.22,.5,1)}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:4px;border-radius:11px;color:var(--s5);font-size:14px;font-weight:500;text-align:left;transition:padding .28s cubic-bezier(.34,1.22,.5,1),gap .28s cubic-bezier(.34,1.22,.5,1),background .16s,color .16s,box-shadow .16s}
.nav-item:hover{background:rgba(15,23,42,.05);color:var(--s8)}
.nav-item.is-active{background:var(--w);color:var(--p700);font-weight:600;box-shadow:inset 3px 0 0 var(--p500),0 1px 2px rgba(15,23,42,.06)}
.nav-item.is-active .nav-ico{color:var(--p600)}
.nav-ico{display:flex;align-items:center;justify-content:center;width:22px;flex-shrink:0}
.nav-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s ease,width .28s cubic-bezier(.34,1.22,.5,1)}
.nav-badge{margin-left:auto;background:var(--r);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px;line-height:1.6;transition:opacity .2s ease,width .28s cubic-bezier(.34,1.22,.5,1)}
.sidebar-foot{border-top:1px solid var(--line);padding:14px 16px;flex-shrink:0}
.sidebar-foot-line{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--s4);white-space:nowrap}
.sidebar-foot-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s ease,width .28s cubic-bezier(.34,1.22,.5,1)}
/* ---------- 折叠开关：合并为单个按钮，开合切换由 JS（navCollapsed / toggleNav）决定 ---------- */

/* ---------- 图标条形态（仅在 ≥768px 生效，手机抽屉始终显示文字） ---------- */
/* 触发条件一：手动收起（宽屏也收成图标条） */
@media(min-width:768px){
  .console[data-nav="closed"] .brand-text,
  .console[data-nav="closed"] .nav-group-title,
  .console[data-nav="closed"] .nav-label,
  .console[data-nav="closed"] .nav-badge,
  .console[data-nav="closed"] .sidebar-foot-text{opacity:0;width:0;max-width:0;padding-left:0;padding-right:0;margin-left:0;margin-right:0;overflow:hidden;pointer-events:none}
  .console[data-nav="closed"] .brand{justify-content:center;padding:20px 8px 16px}
  .console[data-nav="closed"] .nav-group{margin-bottom:12px}
  .console[data-nav="closed"] .nav-item{justify-content:center;padding:11px 0;gap:0}
  .console[data-nav="closed"] .nav-item.is-active{box-shadow:inset 0 0 0 1px var(--p100)}
  .console[data-nav="closed"] .sidebar-foot{padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .console[data-nav="closed"] .sidebar-foot-line{gap:0;justify-content:center}
  .console[data-nav="closed"] .sidebar-foot-btns{flex-direction:column;gap:8px}
}
/* 触发条件二：窄桌面（768–1199px）且用户未手动展开 */
@media(min-width:768px) and (max-width:1199px){
  .console{--nav-cur:var(--nav-w-mini)}
  .console:not([data-nav="open"]) .brand-text,
  .console:not([data-nav="open"]) .nav-group-title,
  .console:not([data-nav="open"]) .nav-label,
  .console:not([data-nav="open"]) .nav-badge,
  .console:not([data-nav="open"]) .sidebar-foot-text{opacity:0;width:0;max-width:0;padding-left:0;padding-right:0;margin-left:0;margin-right:0;overflow:hidden;pointer-events:none}
  .console:not([data-nav="open"]) .brand{justify-content:center;padding:20px 8px 16px}
  .console:not([data-nav="open"]) .nav-group{margin-bottom:12px}
  .console:not([data-nav="open"]) .nav-item{justify-content:center;padding:11px 0;gap:0}
  .console:not([data-nav="open"]) .nav-item.is-active{box-shadow:inset 0 0 0 1px var(--p100)}
  .console:not([data-nav="open"]) .sidebar-foot{padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .console:not([data-nav="open"]) .sidebar-foot-line{gap:0;justify-content:center}
  .console:not([data-nav="open"]) .sidebar-foot-btns{flex-direction:column;gap:8px}
}

/* ---------- 顶栏 ---------- */
.topbar{position:sticky;top:0;z-index:50;height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 22px;background:#FFFFFF;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-titles{min-width:0;flex:1}
.topbar-title{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar-sub{font-size:11.5px;color:var(--s4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;color:var(--s5);transition:background .16s,color .16s}
.icon-btn:hover{background:var(--s1);color:var(--p600)}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--s1);font-size:11px;color:var(--s5);white-space:nowrap}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 0 3px rgba(22,163,74,.16);display:inline-block;flex-shrink:0}
.status-dot.is-off{background:var(--y);box-shadow:0 0 0 3px rgba(245,158,11,.16)}

/* ---------- 面板 / 卡片 ---------- */
.panel{background:var(--w);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04);overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.panel-sub{font-size:11.5px;color:var(--s4)}
.panel-body{padding:16px}
.grid-cards{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:768px){.grid-cards.c2{grid-template-columns:repeat(2,1fr)}.grid-cards.c3{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1024px){.grid-cards.c3{grid-template-columns:repeat(3,1fr)}.grid-cards.c4{grid-template-columns:repeat(4,1fr)}}

/* ---------- 统计卡 ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:1024px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat-card{position:relative;background:var(--w);border:1px solid var(--line);border-radius:14px;padding:15px 16px 14px;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.08);border-color:var(--p100)}
.stat-card:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.stat-ico{position:absolute;right:12px;top:12px;color:var(--p500);opacity:.16}
.stat-num{font-size:26px;font-weight:700;line-height:1.12;letter-spacing:-.5px;font-variant-numeric:tabular-nums;padding-right:38px}
.stat-unit{font-size:12px;font-weight:600;color:var(--s4);margin-left:3px}
.stat-label{font-size:11.5px;color:var(--s4);margin-top:5px}
.stat-sub{font-size:11px;color:var(--s3);margin-top:3px}

/* ---------- 详情 Hub：可点指标卡 / 模块入口 / 子页返回 ---------- */
.stat-card.is-clickable{display:block;width:100%;font:inherit;text-align:left;cursor:pointer;color:inherit}
.stat-card.is-clickable:hover{transform:translateY(-2px);border-color:var(--p100);box-shadow:0 10px 22px rgba(15,23,42,.09)}
.stat-card.is-clickable:focus-visible{outline:2px solid var(--p500);outline-offset:2px}
.hub-entries{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.hub-entry{display:flex;flex-direction:column;gap:9px;padding:13px 14px;border-radius:13px;background:var(--w);border:1px solid var(--line);text-align:left;transition:transform .18s,box-shadow .18s,border-color .18s}
.hub-entry:hover{transform:translateY(-2px);border-color:var(--p100);box-shadow:0 10px 22px rgba(15,23,42,.09)}
.hub-entry-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hub-entry-title{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.hub-entry-more{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--p600);white-space:nowrap}
.hub-entry-sum{font-size:11.5px;color:var(--s4);line-height:1.55;min-height:34px}
.page-back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;padding:7px 13px;border-radius:10px;background:var(--s1);color:var(--s5);font-size:12.5px;font-weight:500;transition:background .18s,color .18s}
.page-back:hover{background:var(--p50);color:var(--p700)}

/* ---------- 数据来源：小 ↗ 图标与来源行 ---------- */
.src-mark{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:5px;color:var(--s3);vertical-align:-2px;margin-left:4px;transition:color .18s,background .18s}
.src-mark:hover{color:var(--p600);background:var(--p50)}
.stat-sub .src-mark{margin-left:6px}
.src-line{display:flex;align-items:flex-start;gap:6px;margin-top:6px;font-size:11px;line-height:1.65;color:var(--s4)}
.src-line .src-mark{margin-left:0;flex:0 0 auto}
.src-line a.src-text{color:var(--p600)}
.plat-group{margin-top:12px}
.plat-group-title{font-size:11.5px;font-weight:600;color:var(--s5);margin-bottom:6px}
.plat-item{display:flex;flex-direction:column;gap:3px;padding:9px 12px;border-radius:10px;background:var(--fill);margin-bottom:6px}
.plat-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.plat-sum{font-size:11.5px;color:var(--s5);line-height:1.62}
.plat-meta{font-size:10.5px;color:var(--s3)}
@media(max-width:900px){
  .hub-entries{grid-template-columns:repeat(2,1fr)}
}

/* ---------- 鼓励语横幅 / 提醒条 ---------- */
.banner{position:relative;border-radius:14px;padding:16px 18px;background:linear-gradient(135deg,#3B82F6,#6366F1);color:#fff;box-shadow:0 10px 26px rgba(59,130,246,.24)}
.banner-inner{position:relative;z-index:1;display:flex;align-items:flex-start;gap:12px}
.banner-text{margin:0;color:#fff;font-size:13.5px;font-weight:500;line-height:1.65}
.banner-tag{color:rgba(255,255,255,.85);font-size:11px}
.banner-btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:600;cursor:pointer;transition:background .18s}
.banner-btn:hover{background:rgba(255,255,255,.3)}
.alert-bar{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.62}
.alert-warn{background:#FFFBEB;color:#B45309;border:1px solid #FDE68A}
.alert-info{background:var(--p50);color:var(--p700);border:1px solid var(--p100)}
.alert-mute{background:var(--s1);color:var(--s5);border:1px solid var(--s2)}

/* ---------- 漏斗 / 柱状图 ---------- */
.funnel{display:flex;flex-direction:column;gap:7px}
.funnel-track{display:flex;align-items:center;gap:10px}
.funnel-row{height:38px;border-radius:9px;background:linear-gradient(90deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#fff;font-size:12.5px;font-weight:600;transition:width .35s cubic-bezier(.4,0,.2,1)}
.funnel-val{font-variant-numeric:tabular-nums}
.funnel-rate{font-size:11px;color:var(--s4);white-space:nowrap;flex-shrink:0}
.bars{display:flex;align-items:flex-end;gap:8px;height:158px;padding-top:6px}
.bar-col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;cursor:default}
.bar{width:100%;max-width:42px;min-height:4px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#60A5FA,#2563EB);transition:filter .18s,transform .18s}
.bar-col:hover .bar{filter:brightness(1.1);transform:scaleY(1.03)}
.bar-val{font-size:11px;font-weight:600;color:var(--s5);font-variant-numeric:tabular-nums}
.bar-label{font-size:10.5px;color:var(--s4);white-space:nowrap}

/* ---------- 快捷入口 ---------- */
.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:768px){.quick-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1280px){.quick-grid{grid-template-columns:repeat(6,1fr)}}
.quick-card{display:flex;flex-direction:column;align-items:flex-start;gap:9px;padding:14px;border-radius:13px;background:var(--w);border:1px solid var(--line);text-align:left;transition:transform .2s,box-shadow .2s,border-color .2s}
.quick-card:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(15,23,42,.09);border-color:var(--p100)}
.quick-ico{width:34px;height:34px;border-radius:10px;background:var(--p50);color:var(--p600);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.quick-card:hover .quick-ico{background:var(--p500);color:#fff}
.quick-title{font-size:13px;font-weight:600}
.quick-desc{font-size:11px;color:var(--s4);line-height:1.5}

/* ---------- 动态列表 ---------- */
.activity{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border-bottom:none}
.activity-ico{width:30px;height:30px;border-radius:9px;background:var(--p50);color:var(--p600);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.activity-main{min-width:0;flex:1}
.activity-text{font-size:12.5px;line-height:1.55;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.activity-meta{font-size:11px;color:var(--s4);margin-top:3px}

/* ---------- 数据表格 ---------- */
.table-wrap{width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--w)}
table.data-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.data-table thead th{position:sticky;top:0;z-index:2;background:var(--fill);color:var(--s5);font-size:11.5px;font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
.data-table th.is-sortable{cursor:pointer;transition:color .16s}
.data-table th.is-sortable:hover{color:var(--p600)}
.data-table tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.data-table tbody tr:nth-child(even){background:rgba(148,163,184,.05)}
.data-table tbody tr:hover{background:var(--p50)}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.data-table .cell-main{font-weight:600;font-size:13px}
.sort-mark{font-size:9px;color:var(--s3);margin-left:4px}
.sort-mark.on{color:var(--p600)}
.cell-sub{font-size:11px;color:var(--s4);margin-top:2px}

/* ---------- chip / 分段控件 ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;background:var(--s1);color:var(--s5);white-space:nowrap}
.chip-p{background:var(--p50);color:var(--p700)}
.chip-g{background:#F0FDF4;color:var(--g)}
.chip-y{background:#FEF3C7;color:#D97706}
.chip-r{background:#FEE2E2;color:#DC2626}
.chip-lg{padding:4px 11px;font-size:11.5px}
/* 院校类别标签（省内地方属三位一体 / 高水平三位一体） */
.chip-cat{background:rgba(99,102,241,.12);color:#4F46E5}
[data-theme="dark"] .chip-cat{background:rgba(99,102,241,.22);color:#A5B4FC}

/* ---------- 最低综合分「原始分 ｜ 百分制」双栏 ---------- */
.score-pair{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.score-raw{font-variant-numeric:tabular-nums}
.score-pct{padding:2px 7px;font-size:10.5px;font-variant-numeric:tabular-nums}
.data-table .score-pair{justify-content:flex-end}
/* 院校库「最低综合分」列：表头与内容统一左对齐（仅限该列，不动全局 .num） */
.data-table td.num.line-col{text-align:left}
.data-table td.num.line-col .score-pair{justify-content:flex-start}
.stat-num .score-pair{gap:8px}
.stat-num .score-pct{font-size:12px;vertical-align:middle}

/* ---------- 开放数据下载：格式卡片展开的子文件列表 + zip ---------- */
.dl-group{display:flex;flex-direction:column;gap:8px}
.quick-card.is-open{border-color:var(--p100);box-shadow:0 8px 20px rgba(15,23,42,.07)}
.dl-files{display:flex;flex-direction:column;gap:6px;margin-left:14px;padding-left:12px;border-left:2px solid var(--p100)}
.dl-file{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:9px;background:var(--fill);border:1px solid transparent;transition:border-color .18s,background .18s}
.dl-file.is-on{border-color:var(--p100);background:var(--p50)}
.dl-file-pick{display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer}
.dl-check{width:15px;height:15px;flex:0 0 auto;accent-color:var(--p500);cursor:pointer}
.dl-file-name{min-width:0;font-size:12.5px;font-weight:500;color:var(--s8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl-file-btn{flex:0 0 auto;padding:4px 12px;border-radius:8px;background:var(--p500);color:#fff;font-size:11.5px;font-weight:600;transition:background .18s}
.dl-file-btn:hover{background:var(--p600)}
.dl-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-left:14px}
.dl-count{font-size:11.5px;color:var(--s4);margin-right:2px}
.dl-mini{padding:7px 12px;border-radius:9px;background:var(--s1);color:var(--s5);font-size:12px;font-weight:500;transition:background .18s,color .18s}
.dl-mini:hover{background:var(--p50);color:var(--p700)}
.dl-mini-p{background:var(--p500);color:#fff;font-weight:600}
.dl-mini-p:hover{background:var(--p600);color:#fff}
.dl-attach{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--s5);cursor:pointer}
.dl-zip-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--p50);color:var(--p700);font-size:12px;font-weight:600;border:1px dashed var(--p100);transition:background .18s}
.dl-zip-btn:hover{background:var(--p100)}
.quick-card.is-static{cursor:default}
.quick-card.is-static:hover{transform:none;box-shadow:none;border-color:var(--line)}
[data-theme="dark"] .dl-zip-btn{color:#93C5FD}
[data-theme="dark"] .dl-file-btn{background:#2563EB}
.seg{display:inline-flex;gap:4px;background:var(--s1);padding:4px;border-radius:12px;max-width:100%;overflow-x:auto}
.seg-item{padding:7px 15px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--s5);white-space:nowrap;transition:background .18s,color .18s,box-shadow .18s}
.seg-item:hover{color:var(--s8)}
.seg-item.is-active{background:var(--w);color:var(--p600);font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.1)}

/* ---------- 移动端抽屉（底部 Tab 栏已移除，移动端导航统一收敛到抽屉） ---------- */
.drawer-mask{position:fixed;inset:0;z-index:65;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);animation:fadeIn .2s}

/* ---------- 空状态 / 骨架 ---------- */
.empty{padding:52px 20px;text-align:center}
.empty-ico{width:48px;height:48px;border-radius:14px;background:var(--s1);color:var(--s3);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty-text{font-size:13px;color:var(--s4)}
.skeleton{background:linear-gradient(90deg,var(--s1) 25%,var(--s2) 37%,var(--s1) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:8px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ---------- 响应式：≥768px 侧边栏为文档流内兄弟容器；<768px 收为抽屉 ---------- */
@media(min-width:768px){
  .drawer-mask,.hamburger{display:none!important}
}
@media(max-width:767px){
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--nav-w);height:100vh;transform:translateX(-100%)}
  .console.nav-open .sidebar{transform:translateX(0);box-shadow:14px 0 44px rgba(15,23,42,.3)}
  .content{padding:16px 14px 28px}
  .topbar{padding:0 12px}
  .topbar-sub{display:none}
}

[data-theme="dark"] .chip-r{background:#2B1518;color:#F87171}
[data-theme="dark"] .tag-green{background:#12291C;color:#4ADE80;border-color:#1C4A30}
[data-theme="dark"] .tag-blue{background:var(--p50);color:#93C5FD;border-color:var(--p100)}

[data-theme="dark"] .badge-red{background:#2B1518;color:#F87171}

[data-theme="dark"] .alert-warn{background:#2A2211;color:#FBBF24;border-color:#4A3A12}
[data-theme="dark"] .alert-info{background:var(--p50);color:#93C5FD;border-color:var(--p100)}
[data-theme="dark"] .compare-adv{background:#2A2211;color:#FBBF24}
[data-theme="dark"] .compare-dis{background:#2B1518;color:#F87171}
[data-theme="dark"] .glass{background:rgba(18,28,46,.94)}
[data-theme="dark"] .topbar{background:rgba(18,28,46,.88)}
[data-theme="dark"] .sidebar{background:#0F1A2C}
[data-theme="dark"] .nav-item:hover{background:rgba(255,255,255,.06)}
[data-theme="dark"] .nav-item.is-active{background:#1B2740;color:#93C5FD;box-shadow:inset 3px 0 0 var(--p500),0 1px 2px rgba(0,0,0,.3)}
[data-theme="dark"] .hero-bg{background:linear-gradient(135deg,#0F1B31,#132444 40%,#0F1B31)}
[data-theme="dark"] .modal-card{background:#121C2E}
[data-theme="dark"] .modal-overlay{background:rgba(2,6,16,.82)}
[data-theme="dark"] .input{background:#0F1930;border-color:var(--s2);color:var(--s8)}
[data-theme="dark"] .input:focus{border-color:var(--p500);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
[data-theme="dark"] .data-table thead th{background:#16213A}
[data-theme="dark"] .data-table tbody tr:nth-child(even){background:rgba(148,163,184,.06)}
[data-theme="dark"] .data-table tbody tr:hover{background:var(--p50)}
[data-theme="dark"] .stat-card:before{background:var(--grad)}
[data-theme="dark"] select.input option{background:#0F1930;color:var(--s8)}
</style>

// === Storage ===
function Lget(k){try{return JSON.parse(localStorage.getItem('3in1_'+k))}catch(e){return null}}

// === API Layer ===
function apiGet(path,cb){
  fetch(path).then(function(r){return r.json()}).then(function(data){cb(data)}).catch(function(){cb(null)});
}
function apiPost(path,body,cb){
  fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json()}).then(function(data){cb(data)}).catch(function(){cb(null)});
}
function getUserId(){
  var uid=Lget('uid');
  if(uid)return uid;
  var fresh='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  Lset('uid',fresh);
  return fresh;
}
// 计数口径（2026-09-17 修复）：仅「本机首次」（localStorage 无 uid）时不带 userId 请求一次
// /api/counter，由服务端 count+1 并返回新 uid，存下后后续一律带 uid 幂等；首屏两处调用用
// counterQueue 去重，保证只计数一次且两处都能拿到真实计数（失败不写 uid，下次可重试）。
var counterQueue=null;
function getUserCounter(cb){
  var uid=Lget('uid');
  if(uid){
    apiGet('/api/counter?userId='+uid,function(data){
      if(data){Lset('counter',data.count);cb(data);}
      else{cb({count:Lget('counter')||0,userId:uid,offline:true});}
    });
    return;
  }
  if(counterQueue){counterQueue.push(cb);return;}
  counterQueue=[cb];
  apiGet('/api/counter',function(data){
    var queue=counterQueue;counterQueue=null;
    if(data&&data.userId){
      Lset('uid',data.userId);Lset('counter',data.count);
      queue.forEach(function(f){f(data)});
    }else{
      var off={count:Lget('counter')||0,offline:true};
      queue.forEach(function(f){f(off)});
    }
  });
}

// === Utils ===
function filterSchools(schools,f,userScore){
  var results=schools.filter(function(s){
    if(f.selectedSubjects.length>0){
      var ok=s.majors.some(function(m){return m.requiredSubjects.length===0||m.requiredSubjects.every(function(sub){return f.selectedSubjects.indexOf(sub)!==-1})});
      if(!ok)return false;
    }
    var q=f.searchQuery.trim().toLowerCase();
    if(q&&s.name.toLowerCase().indexOf(q)===-1&&s.shortName.toLowerCase().indexOf(q)===-1&&!s.aliases.some(function(a){return a.toLowerCase().indexOf(q)!==-1}))return false;
    return true;
  });
  results=results.map(function(s){
    var tier='match';
    if(userScore&&s.admission[0]&&s.admission[0].minScore){
      var diff=userScore-s.admission[0].minScore;
      if(diff>5)tier='safety';else if(diff<-5)tier='reach';
    }
    return{school:s,tier:tier};
  });
  if(f.tierFilter!=='all')results=results.filter(function(r){return r.tier===f.tierFilter});
  return results;
}

function calcXuekao(grades,formula){var xk=(formula&&formula.xuekao)||{};return grades.reduce(function(sum,g){return sum+(xk[g.grade]||0)},0)}
function xkPercent(grades,formula){var fs=(formula&&formula.xuekao&&formula.xuekao.fullScore>0)?formula.xuekao.fullScore:100;var p=calcXuekao(grades,formula)/(fs/100);return isFinite(p)?p:0}
// 学考等级合计：已选等第的「学考折算分」与「百分制折算分」；未选/E 等/无学考折算院校返回 null（UI 显示「—」）
function xuekaoTotal(grades,formula){
  if(!formula||!formula.xuekao||!(formula.xuekao.A>0)||!(formula.xuekao.fullScore>0))return null;
  var picked=(grades||[]).filter(function(g){return g&&g.grade&&g.grade!=='E'});
  if(picked.length===0)return null;
  var sum=calcXuekao(picked,formula);
  return{sum:sum,percent:Math.round(xkPercent(picked,formula)*100)/100,fullScore:formula.xuekao.fullScore,selected:picked.length};
}

function xiaokaoFull(school){return school&&school.formula&&school.formula.xiaokao&&school.formula.xiaokao.fullScore>0?school.formula.xiaokao.fullScore:100}
// 折算口径判定：学考有可用的等级分值表（A+B+C+D > 0，覆盖国科大这类 A/B/C/D 全为 0 的「无等级表」口径），
// 且学考/高考权重均为正，视为标准三一折算；否则为特殊口径（综合评价/含学考扣分等）
function isStandardFormula(formula){return !!(formula&&formula.xuekao&&(formula.xuekao.A+formula.xuekao.B+formula.xuekao.C+formula.xuekao.D)>0&&formula.weights&&formula.weights.xuekao>0&&formula.weights.gaokao>0)}
// 缺失数值统一渲染为「暂无」
function dash(v){return v==null||v===''?'暂无':v}

// === 数据年份：今年(2026)优先、去年(2025)回退 ===
var CURRENT_YEAR=2026;
// 该校展示数据的年份：majorsYear 缺省按今年
function schoolDataYear(school){return (school&&school.majorsYear)||CURRENT_YEAR}
// 今年招生信息是否已发布（专业名单与录取线为今年）
function hasCurrentData(school){return schoolDataYear(school)>=CURRENT_YEAR}
// 取指定年份的校级录取行；无精确年份时回退到 <=year 的最大年份
function admissionRow(school,year){
  var rows=(school&&school.admission)||[],hit=null;
  rows.forEach(function(a){if(a.year===year)hit=a});
  if(hit)return hit;
  rows.forEach(function(a){if(a.year<year&&(!hit||a.year>hit.year))hit=a});
  return hit;
}
// 校级参考线：优先该校数据年份，回退到最近一条有 minScore 的行
function schoolLine(school){
  var y=schoolDataYear(school),row=admissionRow(school,y);
  if(row&&row.minScore!=null)return{score:row.minScore,year:row.year,level:'school',sourceUrl:(school&&school.brochureUrl)||'',isPrev:row.year<CURRENT_YEAR};
  var rows=(school&&school.admission)||[],best=null;
  rows.forEach(function(a){if(a.minScore!=null&&(!best||a.year>best.year))best=a});
  return best?{score:best.minScore,year:best.year,level:'school',sourceUrl:'',isPrev:best.year<CURRENT_YEAR}:null;
}
// 专业参考线：专业 admissionStats 优先，缺则回退校级线
function majorLine(school,major){
  var st=major&&major.admissionStats;
  if(st&&typeof st.minScore==='number'){
    var y=st.year!=null?st.year:schoolDataYear(school);
    return{score:st.minScore,year:y,level:'major',sourceUrl:st.sourceUrl||'',isPrev:y<CURRENT_YEAR};
  }
  return schoolLine(school);
}
// 数据年份标注文案：未发布时提示「2026 待公布，暂用 xx 年数据」
function yearNote(year){return year<CURRENT_YEAR?('（2026 待公布，暂用 '+year+' 年数据）'):''}

// === 数据年份模式（院校库与详情系列可切换；计算器/工作台固定「最新」）===
var YEAR_MODE_LATEST='latest';
var YEAR_MODES=[{k:'latest',l:'最新'},{k:'2026',l:'2026'},{k:'2025',l:'2025'},{k:'2024',l:'2024'}];
function normYearMode(mode){
  if(mode==null||mode===''||mode===YEAR_MODE_LATEST)return YEAR_MODE_LATEST;
  var y=Number(mode);
  return isFinite(y)?y:YEAR_MODE_LATEST;
}
function isLatestMode(mode){return normYearMode(mode)===YEAR_MODE_LATEST}
// 该校有报录记录的年份（倒序）
function dataYears(school){
  var ys=[];
  ((school&&school.admission)||[]).forEach(function(a){if(a&&a.year!=null&&ys.indexOf(a.year)===-1)ys.push(a.year)});
  return ys.sort(function(a,b){return b-a});
}
// 该校在指定模式下是否有记录（「最新」= 只要有任何年份记录）
function hasYearRecord(school,mode){
  var ys=dataYears(school);
  if(!ys.length)return false;
  var m=normYearMode(mode);
  return m===YEAR_MODE_LATEST?true:ys.indexOf(m)>-1;
}
// 指定模式对应的年份：latest → 该校最新年份；具体年 → 该年；无记录返回 null
function targetYear(school,mode){
  var ys=dataYears(school);
  if(!ys.length)return null;
  var m=normYearMode(mode);
  return m===YEAR_MODE_LATEST?ys[0]:m;
}
// 指定模式下的录取行（严格取该年，不回退）
function admissionRowForMode(school,mode){
  var y=targetYear(school,mode);
  if(y==null)return null;
  var hit=null;
  ((school&&school.admission)||[]).forEach(function(a){if(a&&a.year===y)hit=a});
  return hit;
}
// 指定模式下的校级参考线：latest 沿用 schoolLine（含回退）；具体年份严格取该年分数，无则 null
function lineForMode(school,mode){
  if(isLatestMode(mode))return schoolLine(school);
  var row=admissionRowForMode(school,mode);
  if(!row||typeof row.minScore!=='number')return null;
  var y=row.year;
  return{score:row.minScore,year:y,level:'school',sourceUrl:row.sourceUrl||(school&&school.brochureUrl)||'',isPrev:y<CURRENT_YEAR};
}
// 指定模式下的年份角标
function yearChipFor(school,mode){
  if(isLatestMode(mode))return yearChip(school);
  return{l:normYearMode(mode)+' 年',c:'chip-p'};
}
// 读当前年份模式（localStorage，缺省「最新」）
function currentYearMode(){return normYearMode(Lget('yearMode'))}
function yearModeLabel(mode){
  var m=normYearMode(mode);
  if(m===YEAR_MODE_LATEST)return '最新';
  return m+' 年';
}

// 类别取值与 溯源素材/*.json 的 category 字段完全一致
var CATEGORY_HIGH='高水平三位一体';
var CATEGORY_PROV='省内地方属三位一体';
// 院校库类别筛选清单
var CATEGORY_FILTERS=[{k:'all',l:'全部院校'},{k:'prov',c:CATEGORY_PROV,l:'省内地方属'},{k:'high',c:CATEGORY_HIGH,l:'高水平'}];
function categoryOf(school){

function categoryLabel(category){return category===CATEGORY_HIGH?'高水平':'省内地方属'}
// 2026 年是否招生：字段缺省视为「是」，兼容历史数据
function isRecruit2026(school){return !(school&&school.recruit2026===false)}
// 该院校在指定年份模式下是否可见：
//   最新     -> 只出 2026 招生名单院校（即 38 所；2026 未招的备查校不出现）
//   2026 年  -> 2026 名单院校且该年有报录记录
//   2025/2024-> 该年有报录记录（含 2026 未招的备查校）
function schoolVisibleInMode(school,mode){
  if(!school)return false;
  if(isLatestMode(mode))return isRecruit2026(school);
  if(normYearMode(mode)===CURRENT_YEAR)return isRecruit2026(school)&&hasYearRecord(school,CURRENT_YEAR);
  return hasYearRecord(school,mode);
}
// 过滤出该模式下可见的院校（不改动入参数组）
function visibleSchools(schools,mode){
  return (schools||[]).filter(function(s){return schoolVisibleInMode(s,mode)});
}
// 按类别筛选：'all' / 空值 = 不过滤
function filterByCategory(schools,category){
  if(!category||category==='all')return (schools||[]).slice();
  return (schools||[]).filter(function(s){return categoryOf(s)===category});
}
// 该模式下各类别院校数（供筛选 chip 与统计显示）
function categoryCounts(schools,mode){
  var vis=visibleSchools(schools,mode),out={total:vis.length,high:0,prov:0};
  vis.forEach(function(s){if(categoryOf(s)===CATEGORY_HIGH)out.high++;else out.prov++});
  return out;
}

// 分数满量程：>100 视为 750 分制（取该校高考满分，缺省 750），否则按百分制 100
function scoreScaleMax(score,school){
  var n=Number(score);
  if(!isFinite(n)||n<=100)return 100;
  var g=school&&school.formula&&school.formula.gaokao&&school.formula.gaokao.fullScore;
  return (g>0)?g:750;
}
// 百分制换算：保留 1 位小数；非数字返回 null（不伪造）
function toPercentScore(score,school){
  if(score==null||score==='')return null;
  var n=Number(score);
  if(!isFinite(n))return null;
  var max=scoreScaleMax(n,school);
  if(!(max>0))return null;
  return Math.round(n/max*1000)/10;
}

function calcResult(input,school){
  var f=school&&school.formula;if(!f||!f.weights)return null;
  var w=f.weights,gFull=(f.gaokao&&f.gaokao.fullScore>0)?f.gaokao.fullScore:750;
  var xk=calcXuekao(input.xuekaoGrades,f),xs=input.xiaokaoScore||0,gk=input.gaokaoScore||0;
  var xkP=xkPercent(input.xuekaoGrades,f);
  var xf=xiaokaoFull(school);
  var xsP=xf>0?xs/xf*100:0;
  var score=(w.xuekao||0)*xkP+(w.xiaokao||0)*xsP+(w.gaokao||0)*(gk/gFull*100);
  if(!isFinite(score))score=0;
  var adm=school.admission&&school.admission[0];
  var tier='match';
  if(adm&&adm.minScore!=null){var diff=score-adm.minScore;if(diff>5)tier='safety';else if(diff<-5)tier='reach'}
  return{xuekaoConverted:xk,xuekaoPercent:Math.round(xkP*100)/100,xuekaoFullScore:(f.xuekao&&f.xuekao.fullScore)||0,xiaokaoNormalized:Math.round(xsP*100)/100,xiaokaoFull:xf,gaokaoFull:gFull,gaokaoNormalized:Math.round((gk/gFull*100)*100)/100,comprehensiveScore:Math.round(score*100)/100,tier:tier};
}

function reverseGk(target,grades,xs,school){
  var f=school&&school.formula;if(!f||!f.weights||!(f.weights.gaokao>0))return null;
  var gFull=(f.gaokao&&f.gaokao.fullScore>0)?f.gaokao.fullScore:750;
  var xsP=(xiaokaoFull(school)>0?xs/xiaokaoFull(school)*100:0);
  var xkPart=xkPercent(grades,f)*f.weights.xuekao,xsPart=xsP*f.weights.xiaokao;
  var needed=target-xkPart-xsPart;if(needed<0)return 0;
  return Math.ceil((needed/f.weights.gaokao)*(gFull/100));
}

function reverseXs(target,grades,gk,school){
  var f=school&&school.formula;if(!f||!f.weights||!(f.weights.xiaokao>0))return null;
  var gFull=(f.gaokao&&f.gaokao.fullScore>0)?f.gaokao.fullScore:750;
  var xkPart=xkPercent(grades,f)*f.weights.xuekao,gkPart=(gk/gFull*100)*f.weights.gaokao;
  var needed=target-xkPart-gkPart;if(needed<0)return 0;
  return Math.round((needed/f.weights.xiaokao)*100)/100;
}

// 输入收敛：空串保留，非数字忽略，负数回 0，超上限回上限（保留至多两位小数）
function clampNum(raw,max){
  if(raw===''||raw==null)return '';
  var n=Number(raw);
  if(isNaN(n))return raw;
  var c=n;
  if(c<0)c=0;
  if(c>max)c=max;
  return String(Math.round(c*100)/100);
}
// 换算并四舍五入为整百分数；无效返回 null
function pctOf(v,max){
  if(v===''||v==null||isNaN(Number(v))||!(max>0))return null;
  return Math.round(Number(v)/max*100);
}

// 是否存在非 ASCII 码位（决定 ZIP 条目是否需置 UTF-8 标志位 bit 11）
function hasNonAscii(str){
  var s=String(str==null?'':str);
  for(var i=0;i<s.length;i++){if(s.charCodeAt(i)>0x7F)return true}
  return false;
}

// ---- UTF-8 编码（手写，保证浏览器 / Node / vm 沙箱三处字节一致）----
function utf8Bytes(str){
  var s=String(str==null?'':str),out=[];
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c<0x80){out.push(c)}
    else if(c<0x800){out.push(0xC0|(c>>6),0x80|(c&0x3F))}
    else if(c>=0xD800&&c<=0xDBFF){
      var c2=s.charCodeAt(i+1);
      if(c2>=0xDC00&&c2<=0xDFFF){
        var cp=0x10000+((c-0xD800)<<10)+(c2-0xDC00);
        out.push(0xF0|(cp>>18),0x80|((cp>>12)&0x3F),0x80|((cp>>6)&0x3F),0x80|(cp&0x3F));
        i++;
      }else{out.push(0xEF,0xBF,0xBD)}
    }
    else if(c>=0xDC00&&c<=0xDFFF){out.push(0xEF,0xBF,0xBD)}
    else{out.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F))}
  }
  return new Uint8Array(out);
}

// ---- CRC32（ZIP 校验）----
var CRC32_TABLE=null;
function crc32Table(){
  if(CRC32_TABLE)return CRC32_TABLE;
  var t=new Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
    t[n]=c>>>0;
  }
  CRC32_TABLE=t;
  return t;
}
function crc32(bytes){
  var t=crc32Table(),crc=0xFFFFFFFF,len=bytes.length;
  for(var i=0;i<len;i++)crc=(crc>>>8)^t[(crc^bytes[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}

// ---- 最小 ZIP（STORE 无压缩；任何解压工具均可打开）----
function zipU16(v){return [v&0xFF,(v>>>8)&0xFF]}
function zipU32(v){return [v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF]}
function zipDosTime(d){
  var y=d.getFullYear();if(y<1980)y=1980;
  var date=(((y-1980)&0x7F)<<9)|(((d.getMonth()+1)&0xF)<<5)|(d.getDate()&0x1F);
  var time=((d.getHours()&0x1F)<<11)|((d.getMinutes()&0x3F)<<5)|(Math.floor(d.getSeconds()/2)&0x1F);
  return{date:date&0xFFFF,time:time&0xFFFF};
}
function zipStore(files,dateObj){
  files=files||[];
  var dos=zipDosTime(dateObj||new Date());
  var chunks=[],central=[],offset=0,i;
  for(i=0;i<files.length;i++){
    var f=files[i]||{};
    var rawName=f.name||('file'+i);
    var name=utf8Bytes(rawName);
    var data=utf8Bytes(f.content==null?'':f.content);
    var crc=crc32(data);
    // 中文（非 ASCII）条目名需置 bit 11（0x0800）声明 UTF-8，否则 Windows 解压乱码
    var flags=hasNonAscii(rawName)?0x0800:0;
    var lh=[].concat(zipU32(0x04034b50),zipU16(20),zipU16(flags),zipU16(0),zipU16(dos.time),zipU16(dos.date),
      zipU32(crc),zipU32(data.length),zipU32(data.length),zipU16(name.length),zipU16(0));
    chunks.push(new Uint8Array(lh),name,data);
    var ch=[].concat(zipU32(0x02014b50),zipU16(20),zipU16(20),zipU16(flags),zipU16(0),zipU16(dos.time),zipU16(dos.date),
      zipU32(crc),zipU32(data.length),zipU32(data.length),zipU16(name.length),zipU16(0),zipU16(0),
      zipU16(0),zipU16(0),zipU32(0),zipU32(offset));
    central.push(new Uint8Array(ch),name);
    offset+=lh.length+name.length+data.length;
  }
  var centralSize=0;
  for(i=0;i<central.length;i++)centralSize+=central[i].length;
  var eocd=new Uint8Array([].concat(zipU32(0x06054b50),zipU16(0),zipU16(0),zipU16(files.length),zipU16(files.length),
    zipU32(centralSize),zipU32(offset),zipU16(0)));
  var all=chunks.concat(central),total=eocd.length;
  for(i=0;i<all.length;i++)total+=all[i].length;
  var out=new Uint8Array(total),p=0;
  for(i=0;i<all.length;i++){out.set(all[i],p);p+=all[i].length}
  out.set(eocd,p);
  return out;
}

// ---- CSV / Markdown 序列化（CSV、MD 前置 UTF-8 BOM；JSON 不加 BOM）----
function csvCellOf(v){
  var s=(v==null)?'':String(v);
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function csvOf(rows){
  rows=rows||[];
  return '\uFEFF'+rows.map(function(r){return (r||[]).map(csvCellOf).join(',')}).join('\r\n');
}
function mdCellOf(v){return String(v==null?'':v).replace(/\|/g,'\\|').replace(/[\r\n]+/g,' ')}
function mdTableOf(rows){
  rows=rows||[];
  if(!rows.length)return '';
  var head=rows[0];
  var out='| '+head.map(mdCellOf).join(' | ')+' |\n';
  out+='|'+head.map(function(){return '---'}).join('|')+'|\n';
  for(var i=1;i<rows.length;i++)out+='| '+head.map(function(_,j){return mdCellOf(rows[i][j])}).join(' | ')+' |\n';
  return out;
}
function mdOf(sections,meta){
  sections=sections||[];meta=meta||{};
  var out='# 浙江三位一体院校开放数据\n\n';
  out+='> 版本：'+(meta.version||OPEN_DATA_VERSION)+' ｜ 更新时间：'+(meta.updatedAt||OPEN_DATA_DATE)+' ｜ 院校数：'+(meta.count||0)+' 所\n\n';
  out+='## 数据说明\n\n本数据包整理自浙江省教育考试院、各高校招生网与阳光高考网，供报考参考与二次分析。\n\n';
  sections.forEach(function(sec){
    out+='## '+sec.title+'\n\n';
    if(sec.note)out+=sec.note+'\n\n';
    out+=mdTableOf(sec.rows)+'\n';
  });
  out+='## 数据来源\n\n浙江省教育考试院、各高校招生网、阳光高考网。请以官方最新公告为准。\n';
  return '\uFEFF'+out;
}

function exportJoinList(arr,sep){return (arr&&arr.length)?arr.join(sep||'、'):''}
function exportText(v){return (v==null)?'':String(v)}
function exportNum(v){return (v==null||v==='')?'':v}

function exportTransferLabel(tr){
  tr=tr||{};
  if(!tr.detail)return tr.restricted?'受限':'不限';
  return (tr.restricted?'受限：':'')+tr.detail;
}
function exportFirstCampus(school){
  var c=school&&school.info&&school.info.campuses&&school.info.campuses[0];
  return c&&c.name?c.name:'';
}

function buildExportTables(schools){
  schools=schools||[];
  var T={
    schools:[['院校','简称','类型','类别','2026是否招生','主校区','学费(普通)','学费(中外合作)','招生电话','官网','综合满意度','环境满意度','生活满意度','满意度来源','转专业限制','住宿评分','住宿说明','最低综合分(原始)','最低综合分(百分制)','数据年份','招生简章链接']],
    formulas:[['院校','学考A','学考B','学考C','学考D','学考满分','校测满分','高考满分','学考权重','校测权重','高考权重','口径','折算备注','来源年份','来源标题','来源链接']],
    majors:[['院校','专业名','类别','选科要求','计划数']],
    admission:[['院校','年份','报名人数','入围人数','录取人数','最低综合分(原始)','最低综合分(百分制)','学考门槛']],
    examFormats:[['院校','是否笔试','笔试科目','面试形式','是否体测','内容摘要','备考提示']],
    applicationSteps:[['院校','步骤序号','阶段名称','说明','截止时间','所需材料']]
  };
  schools.forEach(function(s){
    s=s||{};
    var name=exportText(s.name);
    var info=s.info||{},sat=s.satisfaction||{},dorm=s.dormitory||{},tr=s.transferRestriction||{},ex=s.examFormat||{};
    var f=s.formula||{},xk=f.xuekao||{},xs=f.xiaokao||{},gk=f.gaokao||{},w=f.weights||{},fs=s.formulaSource||{};
    // 校级参考线：与页面 schoolLine 完全同口径
    var line=schoolLine(s);
    var lineScore=(line&&typeof line.score==='number')?line.score:'';
    var lineYear=(line&&line.year!=null)?line.year:schoolDataYear(s);
    var linePct=(lineScore==='')?'':toPercentScore(lineScore,s);
    T.schools.push([name,exportText(s.shortName),exportTypeName(s.type),categoryOf(s),isRecruit2026(s)?'是':'否',exportFirstCampus(s),
      exportText(info.tuitionGeneral),exportText(info.tuitionSinoForeign),exportText(info.admissionsPhone),exportText(info.website),
      exportNum(sat.overall),exportNum(sat.environment),exportNum(sat.life),exportText(sat.source),
      exportTransferLabel(tr),exportNum(dorm.score),exportText(dorm.description),
      lineScore,(linePct==null?'':linePct),lineYear,exportText(s.brochureUrl)]);
    T.formulas.push([name,exportNum(xk.A),exportNum(xk.B),exportNum(xk.C),exportNum(xk.D),exportNum(xk.fullScore),
      exportNum(xs.fullScore),exportNum(gk.fullScore),
      exportNum(w.xuekao),exportNum(w.xiaokao),exportNum(w.gaokao),
      exportFormulaScope(f),exportText(s.formulaNote),exportNum(fs.year),exportText(fs.title),exportText(fs.url)]);
    (s.majors||[]).forEach(function(m){
      m=m||{};
      T.majors.push([name,exportText(m.name),exportText(m.category),exportJoinList(m.requiredSubjects),exportNum(m.planCount)]);
    });
    (s.admission||[]).forEach(function(a){
      a=a||{};
      var ms=(a.minScore==null)?'':a.minScore;
      T.admission.push([name,exportNum(a.year),exportNum(a.applicants),exportNum(a.passed),exportNum(a.admitted),
        ms,(ms===''?'':toPercentScore(ms,s)),exportText(a.xuekaoRequirement)]);
    });
    T.examFormats.push([name,ex.hasWrittenTest?'是':'否',exportJoinList(ex.writtenTestSubjects),
      exportInterviewLabel(ex.interviewFormat),ex.hasPhysicalTest?'是':'否',
      exportText(ex.contentSummary),exportText(ex.tips)]);
    (s.applicationSteps||[]).forEach(function(st){
      st=st||{};
      T.applicationSteps.push([name,exportNum(st.step),exportText(st.title),exportText(st.description),
        exportText(st.deadline),exportJoinList(st.materials)]);
    });
  });
  return T;
}

function buildOpenDataFiles(schools,version,dataDate){
  schools=schools||[];
  version=version||OPEN_DATA_VERSION;
  dataDate=dataDate||OPEN_DATA_DATE;
  var t=buildExportTables(schools);
  var json=JSON.stringify({version:version,updatedAt:dataDate,count:schools.length,schools:schools},null,2);
  var csv=OPEN_DATA_FILES.csv.map(function(name,i){
    return{name:name,downloadName:exportDownloadName(name),content:csvOf(t[OPEN_DATA_TABLE_KEYS[i]])};
  });
  var sections=[
    {title:'院校总览',note:'一校一行。「类别」区分省内地方属三位一体 / 高水平三位一体；「2026是否招生」为「否」的是 2026 年未参与三位一体招生、仅保留历史数据的院校（本表共 '+schools.length+' 所，其中 2026 年招生 '+schools.filter(function(s){return isRecruit2026(s)}).length+' 所）。最低综合分给出「原始分」与「百分制换算分」两列（原始分 >100 时按该校满分折算为百分制）；数据年份标明该条参考线所属年份。',rows:t.schools},
    {title:'折算规则',note:'学考 A/B/C/D 分值、学考/校测/高考满分与三项权重；「口径」为「特殊」的院校请以招生章程为准。',rows:t.formulas},
    {title:'专业明细',note:'招生专业、类别、选科要求（空为不限）与计划数。',rows:t.majors},
    {title:'历年录取竞争比',note:'历年报名 / 入围 / 录取人数与最低综合分，缺值留空。',rows:t.admission},
    {title:'校测形式',note:'是否笔试 / 面试 / 体测、笔试科目与内容摘要。',rows:t.examFormats},
    {title:'报名流程',note:'各校报名阶段、说明、截止时间与所需材料。',rows:t.applicationSteps}
  ];
  var md={name:OPEN_DATA_FILES.md[0],downloadName:exportDownloadName(OPEN_DATA_FILES.md[0]),content:mdOf(sections,{version:version,updatedAt:dataDate,count:schools.length})};
  var readme={name:OPEN_DATA_README,downloadName:exportDownloadName(OPEN_DATA_README),content:buildOpenDataReadme(version,dataDate,schools.length,schools.filter(function(s){return isRecruit2026(s)}).length)};

  return{version:version,updatedAt:dataDate,count:schools.length,json:jsonFile,csv:csv,md:md,readme:readme,tables:t};
}
// 某个格式的全量磁盘名清单（含数据说明）
function openDataNamesOf(format){
  if(format==='csv')return OPEN_DATA_FILES.csv.concat([OPEN_DATA_README]);
  return OPEN_DATA_FILES[format].concat([OPEN_DATA_README]);
}
// 按格式打包 zip：names 为要装入的磁盘名数组（界面勾选结果）；未传则视为全选
// 返回 {key,label,name,count,bytes}；条目名与 zip 名均为中文
function buildOpenDataZip(format,schools,names,opt){
  opt=opt||{};
  var f=buildOpenDataFiles(schools,opt.version,opt.dataDate);
  var v=f.version,wanted=names&&names.length?names:openDataNamesOf(format);
  var pool=(format==='csv')?f.csv.concat([f.readme]):[(format==='md')?f.md:f.json,f.readme];
  var entries=pool.filter(function(x){return wanted.indexOf(x.name)>-1}).map(function(x){
    return{name:x.downloadName||exportDownloadName(x.name),content:x.content};
  });
  var label=format==='json'?'JSON':(format==='csv'?'CSV':'Markdown');
  return{key:format,label:label+' 数据包',name:'三位一体数据包-'+label+'-'+v+'.zip',count:entries.length,bytes:zipStore(entries)};
}
// 字节数可读化（下载页展示）
function formatBytes(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1024*1024)return (Math.round(n/1024*10)/10)+' KB';
  return (Math.round(n/1048576*100)/100)+' MB';
}

function dashboardStats(schools){
  var out={total:schools.length,current2026:0,fallback2025:0,standardFormula:0,withSatisfaction:0,majorCount:0};
  schools.forEach(function(s){
    if(hasCurrentData(s))out.current2026++;else out.fallback2025++;
    if(isStandardFormula(s.formula))out.standardFormula++;
    if(s.satisfaction&&s.satisfaction.overall!=null)out.withSatisfaction++;
    if(s.majors&&s.majors.length)out.majorCount+=s.majors.length;
  });
  return out;
}
function scoreBuckets(schools){
  var defs=[[0,75,'<75'],[75,80,'75-80'],[80,85,'80-85'],[85,90,'85-90'],[90,101,'≥90']];
  var out=defs.map(function(d){return{label:d[2],count:0}});
  schools.forEach(function(s){
    var l=schoolLine(s);
    if(!l||typeof l.score!=='number')return;
    var v=toPercentScore(l.score,s);
    if(v==null)return;
    for(var i=0;i<defs.length;i++){if(v>=defs[i][0]&&v<defs[i][1]){out[i].count++;break}}
  });
  return out;
}
function schoolSortVal(s,key,mode){
  if(key==='name')return s.name;
  if(key==='type')return s.type==='ministry'?0:1;
  if(key==='location')return (s.info&&s.info.campuses&&s.info.campuses[0]&&s.info.campuses[0].name)||null;
  if(key==='line'){var l=lineForMode(s,mode);return(l&&typeof l.score==='number')?toPercentScore(l.score,s):null}
  if(key==='year')return isLatestMode(mode)?schoolDataYear(s):normYearMode(mode);
  if(key==='majors')return(s.majors||[]).length;
  if(key==='satisfaction')return(s.satisfaction&&s.satisfaction.overall!=null)?s.satisfaction.overall:null;
  return null;
}
function sortSchools(list,key,dir,mode){
  var copy=(list||[]).slice();
  copy.sort(function(a,b){
    var va=schoolSortVal(a,key,mode),vb=schoolSortVal(b,key,mode);
    if(va==null&&vb==null)return 0;
    if(va==null)return 1;
    if(vb==null)return -1;
    if(va<vb)return dir==='asc'?-1:1;
    if(va>vb)return dir==='asc'?1:-1;
    return 0;
  });
  return copy;
}
