// ===== 工具函数 =====
function filterSchools(schools,filter,userScore){
  const{selectedSubjects,minACount,minBCount,searchQuery,tierFilter,categoryFilter}=filter;
  let results=schools.filter(s=>{
    if(selectedSubjects.length>0){
      const hasMatch=s.majors.some(m=>m.requiredSubjects.length===0||m.requiredSubjects.every(sub=>selectedSubjects.includes(sub)));
      if(!hasMatch)return false;
    }
    if(minACount>0||minBCount>0){
      const req=s.admission[0]?.xuekaoRequirement||'';
      const aMatch=req.match(/(\d+)A/),bMatch=req.match(/(\d+)B/);
      const rA=aMatch?parseInt(aMatch[1]):0,rB=bMatch?parseInt(bMatch[1]):0;
      if(minACount<rA||(minACount+minBCount)<(rA+rB))return false;
    }
    if(searchQuery.trim()){
      const q=searchQuery.toLowerCase();
      if(!s.name.toLowerCase().includes(q)&&!s.shortName.toLowerCase().includes(q)&&!s.aliases.some(a=>a.toLowerCase().includes(q)))return false;
    }
    if(categoryFilter&&!s.majors.some(m=>m.category===categoryFilter))return false;
    return true;
  });
  results=results.map(s=>{
    let tier='match';
    if(userScore&&s.admission[0]?.minScore){
      const diff=userScore-s.admission[0].minScore;
      if(diff>5)tier='safety';else if(diff<-5)tier='reach';
    }
    if(tierFilter!=='all'&&tier!==tierFilter)return null;
    return{school:s,tier};
  }).filter(Boolean);
  return results;
}

function calcXuekao(grades,formula){
  return grades.reduce((sum,g)=>sum+(formula.xuekao[g.grade]||0),0);
}

function calcComprehensive(input,school){
  const{formula}=school;
  if(!formula)return null;
  const xk=calcXuekao(input.xuekaoGrades,formula);
  const xs=input.xiaokaoScore||0;
  const gk=input.gaokaoScore||0;
  const score=xk*formula.weights.xuekao+xs*formula.weights.xiaokao+(gk/formula.gaokao.fullScore*100)*formula.weights.gaokao;
  let tier='match';
  if(school.admission[0]?.minScore){
    const diff=score-school.admission[0].minScore;
    if(diff>5)tier='safety';
    else if(diff<-5)tier='reach';
  }
  return{xuekaoConverted:xk,xuekaoFullScore:formula.xuekao.fullScore,xiaokaoNormalized:xs,gaokaoNormalized:(gk/formula.gaokao.fullScore*100),comprehensiveScore:Math.round(score*100)/100,tier};
}

function reverseCalcGaokao(targetScore,grades,xiaokaoScore,school){
  const{formula}=school;
  const xkPart=calcXuekao(grades,formula)*formula.weights.xuekao;
  const xsPart=xiaokaoScore*formula.weights.xiaokao;
  const needed=targetScore-xkPart-xsPart;
  if(needed<0)return 0;
  return Math.ceil((needed/formula.weights.gaokao)*(formula.gaokao.fullScore/100));
}

function reverseCalcXiaokao(targetScore,grades,gaokaoScore,school){
  const{formula}=school;
  const xkPart=calcXuekao(grades,formula)*formula.weights.xuekao;
  const gkPart=(gaokaoScore/formula.gaokao.fullScore*100)*formula.weights.gaokao;
  const needed=targetScore-xkPart-gkPart;
  if(needed<0)return 0;
  return Math.round((needed/formula.weights.xiaokao)*100)/100;
}

      case'treehole':return React.createElement(TreeholePage);
      default:return React.createElement(HomePage,{setPage});
    }
  };
  return React.createElement('div',{className:'min-h-screen flex flex-col bg-s1',style:{'--bg':'#F8FAFC'}},
    React.createElement(Header,{page,mobileOpen,setMobileOpen,setPage}),
    React.createElement('main',{className:'flex-1 pt14 pb-safe'},render()),
    React.createElement(Footer),
    React.createElement(MobileNav,{page,setPage})
  );
}

createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
