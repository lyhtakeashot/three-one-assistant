var FAQ_DATA=[{q:'什么是三位一体招生？',a:'三位一体招生是浙江省特有的高考招生模式，将学考成绩+校测成绩+高考成绩三个维度按比例折算成综合分录取。每位考生在提前批只能填报一所三位一体院校。'},{q:'什么是"冲稳保"策略？',a:'"冲刺"指往年录取分略高于你成绩的院校；"稳妥"指匹配度高的院校；"保底"指录取概率很大的院校。但注意：提前批只能填报一所！'},{q:'学考等级如何折算成综合分？',a:'各校折算标准不同。例如部分院校A=15、B=10、C=6、D=1（满分150分），也有A=10、B=8等。以各校招生章程为准。'},{q:'校测主要考什么？',a:'一般包含笔试和面试。笔试题型因校而异，面试形式有个面和群面两种。部分院校还设体测或心理测试。'},{q:'三位一体录取后可以转专业吗？',a:'各校规定不同。部分可以转，部分限在三一招生专业内转，部分明确禁止。报考前需仔细查看。'},{q:'数据来源是否可靠？',a:'数据来源于浙江省教育考试院官网、各高校招生网和阳光高考网。请以官方最新公告为准。'},{q:'什么是综合分？',a:'综合分是把学考、校测、高考三个成绩按院校章程规定的比例折算后相加得到的总分。例如某校规则：综合分=学考折算分×15%+校测×25%+高考折算分×60%。三位一体录取看的就是综合分排名。'},{q:'校测占比是怎么定的？',a:'由各校招生章程自定，通常在15%~30%之间。绝大多数省属院校采用 学考15%+校测25%+高考60% 的结构，也有部分院校校测占30%。校测占比越高，面试翻盘空间越大，但对准备要求也越高。'},{q:'提前批和普通批会冲突吗？',a:'不冲突但会"拦截"。三一在提前批录取，如果被录取，档案被提走、不再参加普通批；如果提前批未被录取，则自动进入后续普通批次正常投档，不受任何影响。所以三一相当于多一次机会。'},{q:'报名需要准备哪些材料？',a:'身份证、学考成绩单/证明是基础，多数院校还要求个人陈述（自荐信）、获奖证书、技能证书。部分院校要求按固定格式誊写材料并邮寄，务必在报名截止前完成并保留截图凭证。'},{q:'入围后还要做什么？',a:'入围后须在高考后、志愿填报时于提前批第一志愿填报该校三位一体，未在志愿中确认即视为放弃。若校测入围但未填报志愿，不影响后续普通批录取。'},{q:'三位一体可以填报几所？',a:'校测报名阶段理论上可以报多所院校并分别参加校测，但志愿填报时提前批只能填一所三位一体院校。建议校测阶段报2-3所（冲+稳），最终填报时再确定1所。'}];

// === Storage ===
function Lget(k){try{return JSON.parse(localStorage.getItem('3in1_'+k))}catch(e){return null}}
function Lset(k,v){localStorage.setItem('3in1_'+k,JSON.stringify(v))}

// === API Layer ===
function apiGet(path,cb){
  fetch(path).then(function(r){return r.json()}).then(function(data){cb(data)}).catch(function(){cb(null)});
}
function apiPost(path,body,cb){
  fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json()}).then(function(data){cb(data)}).catch(function(){cb(null)});
}
function getUserId(){
  var uid=Lget('uid');
  if(uid)return uid;
  var fresh='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  Lset('uid',fresh);
  return fresh;
}
function getUserCounter(cb){
  var uid=getUserId();
  apiGet('/api/counter?userId='+uid,function(data){
    if(data){Lset('counter',data.count);cb(data);}
    else{cb({count:Lget('counter')||0,userId:uid,offline:true});}
  });
}

function filterSchools(schools,f,userScore){
  var results=schools.filter(function(s){
    if(f.selectedSubjects.length>0){
      var ok=s.majors.some(function(m){return m.requiredSubjects.length===0||m.requiredSubjects.every(function(sub){return f.selectedSubjects.indexOf(sub)!==-1})});
      if(!ok)return false;
    }
    var q=f.searchQuery.trim().toLowerCase();
    if(q&&s.name.toLowerCase().indexOf(q)===-1&&s.shortName.toLowerCase().indexOf(q)===-1&&!s.aliases.some(function(a){return a.toLowerCase().indexOf(q)!==-1}))return false;
    return true;
  });
